[package]
name = "bernard-ledit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bernard-ledit"
readme = "../README.md"
keywords = ["pdf", "image", "geometry", "ocr", "mindee"]
categories = ["multimedia::images", "rendering"]
exclude = [".github/", ".idea/"]


[package.metadata.cargo-udeps.ignore]
development = ["cargo-husky"]
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
# This feature enables direct bindings; core/build.rs links them to the shared library.
pdfium-render = { version = "0.9.4", features = ["static"] }
image = "0.25.9"
jpeg-encoder = "0.7.1"
# setting features to 1_17 to support older versions of libheif
libheif-rs = { version = "3.0", default-features = false, features = ["v1_17"] }

[dev-dependencies]
test-case = { version = "3.3" }

[lints]
workspace = true
