[advisories]
version = 2
# Check all crates (direct and transitive) for unmaintained status
unmaintained = "all"
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) but is a transitive dep via
    # rav1e -> ravif -> image with no available upgrade path.
    { id = "RUSTSEC-2024-0436", reason = "Transitive dep via rav1e/ravif/image; no upstream fix available" },
]

[licenses]
version = 2
# All licenses are denied unless explicitly listed here
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "IJG",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Warn on duplicate versions of the same crate; consider "deny" later
multiple-versions = "deny"
# Deny wildcard dependencies (e.g. "*"), but allow path-only workspace deps
wildcards = "deny"
allow-wildcard-paths = true
# Highlight all duplicate crates in output
highlight = "all"
# Known exceptions for duplicate versions (populate as needed)
skip = [
    { name = "cargo_metadata" },
    { name = "convert_case" },
    { name = "getrandom" },
    { name = "itertools" },
    { name = "libloading" },
    { name = "nom" },
    { name = "r-efi" },
    { name = "shlex" },
    { name = "winnow" },
    { name = "windows-sys" },
]
skip-tree = []

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
