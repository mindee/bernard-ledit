# For Intel Macs
[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

# For Apple Silicon (M1/M2/M3) Macs
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

# pdfium's renderer is not thread-safe; run all tests sequentially to avoid
# heap corruption (SIGABRT) when multiple tests exercise pdfium concurrently.
[env]
RUST_TEST_THREADS = "1"
