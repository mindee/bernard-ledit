name: Build static PDFium
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and overwrite targets that are already published"
        type: boolean
        default: false
  push:
    branches: [add-php-ext-publish]
    paths:
      - core/pdfium-release
      - tools/pdfium-static/**
      - .github/workflows/build-static-pdfium.yml
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2   # googlesource throttles parallel gclient syncs
      matrix:
        include:
          - { target: linux-x64-glibc,   runner: ubuntu-latest, os: linux, cpu: x64,   env: glibc }
          - { target: linux-arm64-glibc, runner: ubuntu-latest, os: linux, cpu: arm64, env: glibc }
          - { target: linux-x64-musl,    runner: ubuntu-latest, os: linux, cpu: x64,   env: musl }
          - { target: linux-arm64-musl,  runner: ubuntu-latest, os: linux, cpu: arm64, env: musl }
          - { target: mac-arm64,         runner: macos-latest,  os: mac,   cpu: arm64, env: "" }
    steps:
      - uses: actions/checkout@v6

      - name: Read PDFium release
        id: rel
        run: echo "tag=$(tr -d '[:space:]' < core/pdfium-release)" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="pdfium-static-${{ steps.rel.outputs.tag }}"; rel="${rel//\//_}"
          asset="libpdfium-${{ matrix.target }}.a"
          if gh release view "$rel" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$asset already in $rel, skipping (run manually with force=true to rebuild)"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v6
        if: steps.exists.outputs.published != 'true' || inputs.force
        with:
          path: /tmp/pdfium-static/pdfium-binaries/pdfium
          key: pdfium-src-${{ hashFiles('core/pdfium-release') }}-${{ matrix.target }}

      - name: Build
        if: steps.exists.outputs.published != 'true' || inputs.force
        shell: bash
        env:
          PDFIUM_ENV: ${{ matrix.env }}
          PDFIUM_OS: ${{ matrix.os }}
          PDFIUM_CPU: ${{ matrix.cpu }}
          OUT_DIR: ${{ github.workspace }}/out/${{ matrix.target }}
        run: |
          max=5
          for attempt in $(seq 1 "$max"); do
            if bash tools/pdfium-static/build.sh 2>&1 | tee build.log; then exit 0; fi
            tail -n 60 build.log | grep -qE 'HTTP 5[0-9]{2}|RPC failed|Could not resolve host|musl\.cc' || exit 1
            [ "$attempt" -lt "$max" ] || { echo "::error::Network failures persisted after $max attempts"; exit 1; }
            wait_s=$(( attempt * 120 + RANDOM % 60 ))
            echo "::warning::Network failure on attempt $attempt/$max, retrying in ${wait_s}s"
            sudo rm -rf /tmp/pdfium-static/pdfium-binaries/_bad_scm
            sleep "$wait_s"
          done
          exit 1

      # The Docker build runs as root; give the files back so the cache can save them.
      - name: Fix ownership
        if: always() && (steps.exists.outputs.published != 'true' || inputs.force)
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/pdfium-static out 2>/dev/null || true

      - name: Show output
        if: always() && (steps.exists.outputs.published != 'true' || inputs.force)
        run: find out -type f 2>/dev/null || true

      - name: Publish
        if: steps.exists.outputs.published != 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lib="$(find "out/${{ matrix.target }}" -name libpdfium.a -print -quit)"
          [ -n "$lib" ] || { echo "::error::libpdfium.a not found under out/${{ matrix.target }}"; exit 1; }
          rel="pdfium-static-${{ steps.rel.outputs.tag }}"; rel="${rel//\//_}"
          cp "$lib" "libpdfium-${{ matrix.target }}.a"
          gh release view "$rel" >/dev/null 2>&1 || gh release create "$rel" --title "$rel" --notes "Static PDFium for bernard-ledit"
          gh release upload "$rel" "libpdfium-${{ matrix.target }}.a" --clobber

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build.log
