name: Build static PDFium
on:
  workflow_dispatch:
  push:
    branches: [add-php-ext-publish]
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { target: linux-x64-glibc,   runner: ubuntu-latest, os: linux, cpu: x64 }
          - { target: linux-arm64-glibc, runner: ubuntu-latest, os: linux, cpu: arm64 }
    steps:
      - uses: actions/checkout@v6

      - name: Read PDFium release
        id: rel
        run: echo "tag=$(tr -d '[:space:]' < core/pdfium-release)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: /tmp/pdfium-static/pdfium-binaries/pdfium
          key: pdfium-src-${{ hashFiles('core/pdfium-release') }}-${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          PDFIUM_OS: ${{ matrix.os }}
          PDFIUM_CPU: ${{ matrix.cpu }}
          OUT_DIR: ${{ github.workspace }}/out/${{ matrix.target }}
        run: |
          for attempt in 1 2 3; do
            if bash tools/pdfium-static/build.sh 2>&1 | tee build.log; then exit 0; fi
            grep -qE 'HTTP 5[0-9]{2}|RPC failed|Could not resolve host' build.log || exit 1
            echo "::warning::Network failure on attempt $attempt, retrying in $((attempt * 60))s"
            sudo rm -rf /tmp/pdfium-static/pdfium-binaries/_bad_scm
            sleep $((attempt * 60))
          done
          exit 1

      # The Docker build runs as root; give the files back so the cache can save them.
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/pdfium-static out 2>/dev/null || true

      - name: Show output
        if: always()
        run: find out -type f 2>/dev/null || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lib="$(find "out/${{ matrix.target }}" -name libpdfium.a -print -quit)"
          [ -n "$lib" ] || { echo "::error::libpdfium.a not found under out/${{ matrix.target }}"; exit 1; }
          rel="pdfium-static-${{ steps.rel.outputs.tag }}"; rel="${rel//\//_}"
          cp "$lib" "libpdfium-${{ matrix.target }}.a"
          gh release view "$rel" >/dev/null 2>&1 || gh release create "$rel" --title "$rel" --notes "Static PDFium for bernard-ledit"
          gh release upload "$rel" "libpdfium-${{ matrix.target }}.a" --clobber

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build.log
