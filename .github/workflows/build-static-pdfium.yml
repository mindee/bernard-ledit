name: Build static PDFium
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and overwrite targets that are already published"
        type: boolean
        default: false
  push:
    branches: [ add-php-ext-publish ]
    paths:
      - core/pdfium-release
      - tools/pdfium-static/**
      - .github/workflows/build-static-pdfium.yml
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2   # googlesource throttles parallel gclient syncs
      matrix:
        include:
          - { target: linux-x64-glibc,   runner: ubuntu-latest,  os: linux, cpu: x64,   env: glibc, lib_ext: a,   work_dir: /tmp/pdfium-static }
          - { target: linux-arm64-glibc, runner: ubuntu-latest,  os: linux, cpu: arm64, env: glibc, lib_ext: a,   work_dir: /tmp/pdfium-static }
          - { target: linux-x64-musl,    runner: ubuntu-latest,  os: linux, cpu: x64,   env: musl,  lib_ext: a,   work_dir: /tmp/pdfium-static }
          - { target: linux-arm64-musl,  runner: ubuntu-latest,  os: linux, cpu: arm64, env: musl,  lib_ext: a,   work_dir: /tmp/pdfium-static }
          - { target: mac-arm64,         runner: macos-latest,   os: mac,   cpu: arm64, env: "",    lib_ext: a,   work_dir: /tmp/pdfium-static }
          - { target: win-x64-v143, runner: windows-latest, os: win, cpu: x64, env: "", lib_ext: lib, work_dir: "C:/pdfium-static", msvc: "14.44" }
          - { target: win-x64-v142, runner: windows-latest, os: win, cpu: x64, env: "", lib_ext: lib, work_dir: "C:/pdfium-static", msvc: "14.29" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Read PDFium release
        id: rel
        run: echo "tag=$(tr -d '[:space:]' < core/pdfium-release)" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="pdfium-static-${{ steps.rel.outputs.tag }}"; rel="${rel//\//_}"
          asset="libpdfium-${{ matrix.target }}.${{ matrix.lib_ext }}"
          if gh release view "$rel" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$asset already in $rel, skipping (run manually with force=true to rebuild)"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v6
        if: steps.exists.outputs.published != 'true' || inputs.force
        with:
          path: |
            ${{ matrix.work_dir }}/pdfium-binaries/pdfium
            !${{ matrix.work_dir }}/pdfium-binaries/pdfium/out
          key: pdfium-src-${{ hashFiles('core/pdfium-release') }}-${{ matrix.target }}

      - name: Prepare Windows build
        if: runner.os == 'Windows' && (steps.exists.outputs.published != 'true' || inputs.force)
        run: |
          git config --global core.longpaths true
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          "/c/Program Files/LLVM/bin/llvm-nm.exe" --version
        shell: bash

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows' && (steps.exists.outputs.published != 'true' || inputs.force)
        with:
          python-version: "3.12"

      - name: Build
        if: steps.exists.outputs.published != 'true' || inputs.force
        shell: bash
        env:
          PDFIUM_ENV: ${{ matrix.env }}
          PDFIUM_OS: ${{ matrix.os }}
          PDFIUM_CPU: ${{ matrix.cpu }}
          OUT_DIR: ${{ github.workspace }}/out/${{ matrix.target }}
          WORK_DIR: ${{ matrix.work_dir }}
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
          MSVC_TOOLSET: ${{ matrix.msvc }}
        run: |
          max=5
          for attempt in $(seq 1 "$max"); do
            if bash tools/pdfium-static/build.sh 2>&1 | tee build.log; then exit 0; fi
            tail -n 60 build.log | grep -qE 'HTTP 5[0-9]{2}|RPC failed|Could not resolve host|musl\.cc' || exit 1
            [ "$attempt" -lt "$max" ] || { echo "::error::Network failures persisted after $max attempts"; exit 1; }
            wait_s=$(( attempt * 120 + RANDOM % 60 ))
            echo "::warning::Network failure on attempt $attempt/$max, retrying in ${wait_s}s"
            rm -rf "$WORK_DIR/pdfium-binaries/_bad_scm" 2>/dev/null || sudo rm -rf "$WORK_DIR/pdfium-binaries/_bad_scm"
            sleep "$wait_s"
          done
          exit 1
      - name: Upload raw Windows build (debug)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.target }}
          path: |
            C:/pdfium-static/pdfium-binaries/pdfium/out/obj/pdfium.lib
            C:/pdfium-static/pdfium-binaries/pdfium/out/obj/third_party/libjpeg_turbo/
            C:/pdfium-static/pdfium-binaries/pdfium/third_party/llvm-build/Release+Asserts/bin/llvm-*.exe
      # The Docker build runs as root; give the files back so the cache can save them.
      - name: Fix ownership
        if: always() && runner.os != 'Windows' && (steps.exists.outputs.published != 'true' || inputs.force)
        run: sudo chown -R "$(id -u):$(id -g)" "${{ matrix.work_dir }}" out 2>/dev/null || true

      - name: Show output
        if: always() && (steps.exists.outputs.published != 'true' || inputs.force)
        run: |
          find out -type f 2>/dev/null || true
          echo "--- staging:"
          find "${{ matrix.work_dir }}/pdfium-binaries/staging" -type f 2>/dev/null | head -n 50 || true
          echo "--- jpeg archives:"
          ls "${{ matrix.work_dir }}/pdfium-binaries/pdfium/out/obj/third_party/libjpeg_turbo" 2>/dev/null || true
          echo "--- args.gn:"
          cat "${{ matrix.work_dir }}/pdfium-binaries/staging/args.gn" 2>/dev/null || true
          echo "--- built libraries:"
          ls -la "${{ matrix.work_dir }}/pdfium-binaries/pdfium/out/obj/"*.lib 2>/dev/null || true

      - name: Pin the target MSVC toolset (Windows)
        if: runner.os == 'Windows' && (steps.exists.outputs.published != 'true' || inputs.force)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ matrix.msvc }}
      - name: Check the library against the target toolset (Windows)
        if: runner.os == 'Windows' && (steps.exists.outputs.published != 'true' || inputs.force)
        run: |
          lib="$(cygpath -w "$(find "out/${{ matrix.target }}" -name pdfium.lib -print -quit)")"
          MSYS_NO_PATHCONV=1 lib.exe /NOLOGO /LIST "$lib" > /dev/null
          # Link a throwaway DLL that pulls in the API we use: unresolved symbols fail here,
          # with this toolset's link.exe and runtime libraries, before anything is published.
          # Full path: Git Bash's GNU `link` would otherwise shadow Visual Studio's link.exe.
          msvc_link="$(cygpath -u "$VCToolsInstallDir")/bin/Hostx64/x64/link.exe"
          # Only unresolved symbols referenced from pdfium.lib count; errors from the C runtime's
          # own startup objects come from this artificial entry-point-less link, not the library.
          MSYS_NO_PATHCONV=1 "$msvc_link" /NOLOGO /DLL /NOENTRY /MACHINE:X64 /OUT:linktest.dll \
            /INCLUDE:FPDF_InitLibraryWithConfig /INCLUDE:FPDF_LoadMemDocument64 \
            /INCLUDE:FPDF_RenderPageBitmap /INCLUDE:FPDFText_LoadPage \
            /INCLUDE:FPDFPage_GenerateContent /INCLUDE:FPDF_SaveAsCopy \
            "$lib" msvcrt.lib msvcprt.lib vcruntime.lib ucrt.lib \
            gdi32.lib user32.lib advapi32.lib > linktest.log 2>&1 || true
          if grep -E '^pdfium\.lib\(.*unresolved external symbol' linktest.log; then
            echo "::error::pdfium.lib needs symbols that toolset ${{ matrix.msvc }} doesn't provide (see above)"
            exit 1
          fi
          echo "pdfium.lib links with toolset ${{ matrix.msvc }}"

      - name: Publish
        if: steps.exists.outputs.published != 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lib="$(find "out/${{ matrix.target }}" \( -name libpdfium.a -o -name pdfium.lib \) -print -quit)"
          [ -n "$lib" ] || { echo "::error::PDFium library not found under out/${{ matrix.target }}"; exit 1; }
          rel="pdfium-static-${{ steps.rel.outputs.tag }}"; rel="${rel//\//_}"
          asset="libpdfium-${{ matrix.target }}.${{ matrix.lib_ext }}"
          cp "$lib" "$asset"
          gh release view "$rel" >/dev/null 2>&1 || gh release create "$rel" --title "$rel" --notes "Static PDFium for bernard-ledit"
          gh release upload "$rel" "$asset" --clobber
        shell: bash

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build.log
