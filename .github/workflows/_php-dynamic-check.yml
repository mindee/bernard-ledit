name: PHP release checks (dynamic PDFium)

# Tests the release PHP extension with dynamically loaded PDFium. With a release tag, each job also
# packages the extension and shared PDFium library as a PIE asset.
on:
  workflow_call:
    inputs:
      release-tag:
        description: "Release tag to package the tested extensions for; empty to only test"
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ inputs.release-tag }}

jobs:
  php-binding-tests:
    name: Test PHP release (${{ matrix.platform.pdfium_target }}, PHP ${{ matrix.php }} ${{ matrix.thread_safety }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,    pdfium_target: linux-x64-glibc,   extension: libbernard_ledit_php.so }
          - { runner: ubuntu-24.04-arm, pdfium_target: linux-arm64-glibc, extension: libbernard_ledit_php.so }
          - { runner: macos-latest,     pdfium_target: mac-arm64,         extension: libbernard_ledit_php.dylib }
          - { runner: macos-15-intel,   pdfium_target: mac-x64,           extension: libbernard_ledit_php.dylib }
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        thread_safety: [ "zts", "nts" ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-libheif

      - uses: extractions/setup-just@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: php-dynamic-${{ matrix.platform.pdfium_target }}-php${{ matrix.php }}-${{ matrix.thread_safety }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
        env:
          phpts: ${{ matrix.thread_safety }}

      - name: Build and test (dynamic PDFium)
        run: just php test-release

      - name: Check runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          deps="$(otool -L target/release/libbernard_ledit_php.dylib)"
          echo "$deps"
          if ! grep -qi libheif <<< "$deps"; then
            echo "::error::The extension does not link system libheif dynamically"
            exit 1
          fi

      # The extension and the bundled PDFium must load on the oldest supported glibc.
      - name: Check runtime dependencies and glibc 2.35 compatibility (Linux)
        if: runner.os == 'Linux'
        run: |
          ext=target/release/libbernard_ledit_php.so
          pdfium="$(just php pdfium-path)"
          deps="$(ldd "$ext")"
          echo "$deps"
          if ! grep -qi libheif <<< "$deps"; then
            echo "::error::The extension does not link system libheif dynamically"
            exit 1
          fi
          newest_glibc="$(objdump -T "$ext" "$pdfium" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)"
          echo "Newest glibc symbol version required by the extension and PDFium: $newest_glibc"
          if [ "$(printf '%s\n' "$newest_glibc" 2.35 | sort -V | tail -n 1)" != 2.35 ]; then
            echo "::error::The extension or PDFium requires glibc $newest_glibc, newer than 2.35"
            exit 1
          fi

      - name: Package for PIE
        if: env.RELEASE_TAG != ''
        run: bash bindings/php/tools/pie-package.sh "target/release/${{ matrix.platform.extension }}" "$RELEASE_TAG" dist "$(just php pdfium-path)"

      - name: Keep the PIE asset for the release
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: pie-${{ matrix.platform.pdfium_target }}-php${{ matrix.php }}-${{ matrix.thread_safety }}
          path: dist/
          if-no-files-found: error

  # Alpine runs through `docker run` rather than a job container: GitHub can't run JavaScript
  # actions inside Alpine containers on arm64 runners.
  php-binding-tests-musl:
    name: Test PHP release (${{ matrix.platform.pdfium_target }}, PHP ${{ matrix.php }} ${{ matrix.thread_safety }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,    pdfium_target: linux-x64-musl }
          - { runner: ubuntu-24.04-arm, pdfium_target: linux-arm64-musl }
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        thread_safety: [ "zts", "nts" ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Rust links the C runtime statically on musl by default, which a PHP extension must not do.
      # Packaging runs in the container too: the asset name comes from the PHP that tested it.
      - name: Build and test in Alpine
        env:
          IMAGE: php:${{ matrix.php }}-${{ matrix.thread_safety == 'zts' && 'zts' || 'cli' }}-alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            -e RELEASE_TAG \
            "$IMAGE" sh -euc '
              apk add --no-cache bash git curl unzip zip build-base cmake nasm clang-dev linux-headers just rustup libstdc++ libheif-dev python3
              if apk search -e libheif-libde265 | grep -q .; then
                apk add --no-cache libheif-libde265
              fi
              pkg-config --atleast-version=1.17 libheif
              python3 .github/actions/setup-libheif/check.py
              rustup-init -y --default-toolchain none --profile minimal
              . "$HOME/.cargo/env"
              curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              just php test-release
              deps="$(ldd target/release/libbernard_ledit_php.so 2>/dev/null || true)"
              echo "$deps"
              if ! echo "$deps" | grep -qi libheif; then
                echo "The extension does not link system libheif dynamically" >&2
                exit 1
              fi
              if [ -n "$RELEASE_TAG" ]; then
                bash bindings/php/tools/pie-package.sh target/release/libbernard_ledit_php.so "$RELEASE_TAG" dist "$(just php pdfium-path)"
              fi
            '

      - name: Keep the PIE asset for the release
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: pie-${{ matrix.platform.pdfium_target }}-php${{ matrix.php }}-${{ matrix.thread_safety }}
          path: dist/
          if-no-files-found: error

  php-binding-tests-windows:
    name: Test PHP release (${{ matrix.pdfium_target }}, PHP ${{ matrix.php }} ${{ matrix.thread_safety }})
    runs-on: windows-latest
    env:
      # ext-php-rs needs nightly on Windows (vectorcall ABI); this overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        thread_safety: [ "zts", "nts" ]
        # The extension must link with the MSVC toolset its PHP version was built with.
        include:
          - { php: "8.1", msvc: "14.29", pdfium_target: win-x64-v142 }
          - { php: "8.2", msvc: "14.29", pdfium_target: win-x64-v142 }
          - { php: "8.3", msvc: "14.29", pdfium_target: win-x64-v142 }
          - { php: "8.4", msvc: "14.44", pdfium_target: win-x64-v143 }
          - { php: "8.5", msvc: "14.44", pdfium_target: win-x64-v143 }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-libheif

      - uses: extractions/setup-just@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: php-dynamic-${{ matrix.pdfium_target }}-php${{ matrix.php }}-${{ matrix.thread_safety }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
        env:
          phpts: ${{ matrix.thread_safety }}

      - name: Pin the MSVC toolset of the PHP build
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ matrix.msvc }}

      # Git Bash puts its GNU link.exe ahead of MSVC's on PATH, where Rust looks up the linker.
      - name: Remove Git's GNU link.exe
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"

      - name: Build and test (dynamic PDFium)
        run: just php test-release

      - name: Check runtime dependencies
        run: |
          imports="$("/c/Program Files/LLVM/bin/llvm-readobj.exe" --coff-imports target/release/bernard_ledit_php.dll | grep -i '^ *Name:' || true)"
          echo "$imports"
          if ! grep -qi heif <<< "$imports"; then
            echo "::error::The extension does not link system libheif dynamically"
            exit 1
          fi

      - name: Package for PIE
        if: env.RELEASE_TAG != ''
        run: bash bindings/php/tools/pie-package.sh target/release/bernard_ledit_php.dll "$RELEASE_TAG" dist "$(just php pdfium-path)"

      - name: Keep the PIE asset for the release
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: pie-${{ matrix.pdfium_target }}-php${{ matrix.php }}-${{ matrix.thread_safety }}
          path: dist/
          if-no-files-found: error
