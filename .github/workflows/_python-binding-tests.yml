name: Python binding tests

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string
        description: "A JSON-formatted string array of Python versions to test"

  workflow_dispatch:
    inputs:
      python_version:
        description: "Select a Python version to test (or all)"
        type: choice
        required: true
        default: "3.9"
        options:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "All"
jobs:
  python-binding-tests:
    name: Test Python binding (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.python_version == 'All' && '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]' || format('["{0}"]', inputs.python_version)) || inputs['python-versions']) }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache PDFium binary
        uses: actions/cache@v6
        with:
          path: core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ hashFiles('core/build.rs') }}
          restore-keys: |
            pdfium-${{ runner.os }}-
      - uses: extractions/setup-just@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: python-binding-${{ matrix.os }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/pyproject.toml

      - name: Install Python dependencies
        run: uv pip install --system -e ".[test]"
        working-directory: bindings/python

      - name: Run Python binding tests
        run: just python test
