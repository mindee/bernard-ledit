name: Python binding tests

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string
        description: "A JSON-formatted string array of Python versions to test"

  workflow_dispatch:
    inputs:
      python_version:
        description: "Select a Python version to test (or all)"
        type: choice
        required: true
        default: "3.9"
        options:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "All"
permissions:
  contents: read

jobs:
  python-binding-tests:
    name: Test Python binding (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.python_version == 'All' && '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]' || format('["{0}"]', inputs.python_version)) || inputs['python-versions']) }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-libheif

      - name: Select static PDFium target
        id: pdfium
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) target=linux-x64-glibc ;;
            macOS)
              case "$(uname -m)" in
                arm64) target=mac-arm64 ;;
                x86_64) target=mac-x64 ;;
                *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              ;;
            Windows) target=win-x64-v143 ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Cache static PDFium
        uses: actions/cache@v6
        with:
          path: .pdfium-static
          key: pdfium-static-${{ steps.pdfium.outputs.target }}-${{ hashFiles('core/pdfium-release') }}

      - name: Download static PDFium
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .pdfium-static/libpdfium.a ] && [ ! -f .pdfium-static/pdfium.lib ]; then
            bash tools/pdfium-static/download.sh "${{ steps.pdfium.outputs.target }}" "$PWD/.pdfium-static"
          fi
          echo "PDFIUM_STATIC_LIB_PATH=$PWD/.pdfium-static" >> "$GITHUB_ENV"

      - uses: extractions/setup-just@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: python-binding-${{ matrix.os }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create a virtualenv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/pyproject.toml

      - name: Install Maturin
        run: uv pip install "maturin>=1.0,<2.0"
        working-directory: bindings/python

      - name: Run Python binding tests
        run: just python test
