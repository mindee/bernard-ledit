name: Hack test release

on:
  workflow_call:
permissions:
  contents: read
jobs:
  hack-test-release:
    name: Hack release tests (Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-libheif
      - uses: ./.github/actions/setup-pdfium
      - uses: extractions/setup-just@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: hack-test-release-${{ runner.os }}

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-nextest

      - name: Run release feature powerset tests
        run: just core hack-test-release
