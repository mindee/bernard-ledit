name: Debug Windows namespacing
on:
  push:
    branches: [ add-php-ext-publish ]
    paths:
      - .github/workflows/debug-namespace-win.yml
      - tools/pdfium-static/namespace_pdfium_jpeg.py
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of the build that uploaded raw-win-x64"
        required: false

env:
  # Build run that uploaded the raw-win-x64 artifact; override via workflow_dispatch input.
  RAW_RUN_ID: ${{ inputs.run_id || '39420237617' }}

permissions:
  contents: read
  actions: read

jobs:
  debug:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: raw-win-x64
          run-id: ${{ env.RAW_RUN_ID }}
          github-token: ${{ github.token }}
          path: C:/nsdebug/pdfium

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install latest LLVM
        run: |
          choco upgrade llvm -y --no-progress
          "/c/Program Files/LLVM/bin/llvm-objcopy.exe" --version

      - name: Compare one NASM object before and after objcopy
        run: |
          lib=/c/nsdebug/pdfium/out/obj/pdfium.lib
          LLVM="/c/Program Files/LLVM/bin"
          member="$("$LLVM/llvm-ar.exe" t "$lib" | grep 'jccolor-sse2.o' | head -n 1)"
          mkdir -p before && (cd before && "$LLVM/llvm-ar.exe" x "$lib" "$member")
          obj="$(find before -name jccolor-sse2.o | head -n 1)"

          dump() {
            {
              echo "================ $1"
              "$LLVM/llvm-readobj.exe" --file-headers --symbols "$1" 2>&1 | head -n 80
              echo "--- nm:"
              "$LLVM/llvm-nm.exe" --extern-only "$1" 2>&1
            } > "$1.txt"
            cat "$1.txt"
          }

          dump "$obj"
          "$LLVM/llvm-objcopy.exe" --redefine-sym jsimd_rgb_ycc_convert_sse2=bernard_pdfium_jsimd_rgb_ycc_convert_sse2 "$obj" after.o
          dump after.o
