name: Release tests

on:
  workflow_call:
permissions:
  contents: read
jobs:
  test-release:
    name: Release tests (Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: extractions/setup-just@v4

      - name: Cache PDFium binary
        uses: actions/cache@v6
        with:
          path: core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ hashFiles('core/build.rs') }}
          restore-keys: |
            pdfium-${{ runner.os }}-

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-release-${{ runner.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run release tests
        run: just core test-release