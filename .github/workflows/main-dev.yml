name: Main and Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A new push cancels the current run.
# A version commit (with :bookmark: in the message) uses a separate group. This prevents a later push from stopping the run before
# it creates the tag and release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ contains(github.event.head_commit.message, ':bookmark:') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    uses: ./.github/workflows/_pre-commit.yml

  core-tests:
    uses: ./.github/workflows/_core-tests.yml
    needs: pre-commit

  python-binding-tests:
    uses: ./.github/workflows/_python-binding-tests.yml
    needs: pre-commit
    with:
      python-versions: ${{ vars.PYTHON_VERSIONS }}

  php-binding-tests:
    uses: ./.github/workflows/_php-binding-tests.yml
    needs: pre-commit
    with:
      php-versions: ${{ vars.PHP_VERSIONS }}

  java-binding-tests:
    uses: ./.github/workflows/_java-binding-tests.yml
    needs: pre-commit
    with:
      java-versions: ${{ vars.JAVA_VERSIONS }}


  # The tag a version commit (":bookmark: Version X.Y.Z") gets: v + the workspace version in
  # Cargo.toml, which the commit message must name. Empty for any other commit.
  version:
    name: Read the release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare the commit message with Cargo.toml
        id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" != *":bookmark:"* ]]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(yq -p=toml -o=yaml -r -e '.workspace.package.version' Cargo.toml)"
          named="$(grep -oE 'Version [0-9]+\.[0-9]+\.[0-9]+([-.](alpha|beta|rc)[0-9])?' <<< "$MESSAGE" | head -n 1 | cut -d' ' -f2 || true)"
          if [ "$named" != "$version" ]; then
            echo "::error::The commit message names version '$named', but Cargo.toml has $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  # Only runs for a version commit, once everything above has passed.
  tag:
    if: contains(github.event.head_commit.message, ':bookmark:')
    uses: mindee/client-lib-actions/.github/workflows/tag-version.yml@main
    needs:
      - pre-commit
      - core-tests
      - python-binding-tests
      - php-binding-tests
      - java-binding-tests
      - version
    permissions:
      contents: write

  # Creates the release as a draft, which nobody sees until publish-release makes it public.
  release:
    uses: ./.github/workflows/_release-create.yml
    needs: tag
    permissions:
      contents: write

  package-php:
    uses: ./.github/workflows/_php-package-pie.yml
    needs: [ version, release ]
    with:
      release-tag: ${{ needs.version.outputs.tag }}

  publish-release:
    name: Upload the PIE archives and publish the release
    needs: [ version, release, package-php ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the PIE archives
        uses: actions/download-artifact@v4
        with:
          pattern: pie-*
          merge-multiple: true
          path: dist

      - name: Upload them, then publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -1 ./*.zip
          sha256sum ./*.zip > SHA256SUMS-php
          gh release upload "$TAG" ./*.zip SHA256SUMS-php --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
