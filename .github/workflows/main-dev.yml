name: Main and Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push cancels the run in progress, except for a version commit (:bookmark:), which gets
# a group of its own: cancelling it would silently skip its tag and release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ contains(github.event.head_commit.message, ':bookmark:') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: ./.github/workflows/_workflow_lint.yml

  pre-commit:
    uses: ./.github/workflows/_pre-commit.yml
    needs: workflow-lint

  unit-tests:
    uses: ./.github/workflows/_unit-tests.yml
    needs: pre-commit

  python-binding-tests:
    uses: ./.github/workflows/_python-binding-tests.yml
    needs: pre-commit
    with:
      python-versions: '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]'

  php-binding-tests:
    uses: ./.github/workflows/_php-binding-tests.yml
    needs: pre-commit
    with:
      php-versions: '["8.1", "8.2", "8.3", "8.4", "8.5"]'

  java-binding-tests:
    uses: ./.github/workflows/_java-binding-ci.yml
    needs: pre-commit
    with:
      java-versions: '["11", "17", "21"]'

  hack-test-release:
    uses: ./.github/workflows/_hack-test-release.yml
    needs: unit-tests

  # Builds any missing static PDFium library, then tests the PHP extension against all of them.
  static-pdfium:
    uses: ./.github/workflows/build-static-pdfium.yml
    needs: pre-commit
    permissions:
      contents: write

  # Only runs for a ":bookmark: Version X.Y.Z" commit, once everything above has passed.
  tag:
    if: contains(github.event.head_commit.message, ':bookmark:')
    uses: mindee/client-lib-actions/.github/workflows/tag-version.yml@main
    needs:
      - python-binding-tests
      - php-binding-tests
      - java-binding-tests
      - hack-test-release
      - static-pdfium
    permissions:
      contents: write

  release:
    uses: ./.github/workflows/_create-release.yml
    needs: tag
    secrets: inherit
