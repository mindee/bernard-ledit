name: Main and Dev

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: ./.github/workflows/_workflow_lint.yml

  pre-commit:
    uses: ./.github/workflows/_pre-commit.yml
    needs: workflow-lint

  unit-tests:
    uses: ./.github/workflows/_unit-tests.yml
    needs: pre-commit

  python-binding-tests:
    uses: ./.github/workflows/_python-binding-tests.yml
    needs: pre-commit
    with:
      python-versions: '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]'

  java-binding-tests:
    uses: ./.github/workflows/_java-binding-ci.yml
    needs: pre-commit
    with:
      java-versions: '["11", "17", "21"]'

  hack-test-release:
    uses: ./.github/workflows/_hack-test-release.yml
    needs: unit-tests

  publish-wheels:
    uses: ./.github/workflows/_publish-wheels.yml
    needs: [unit-tests, python-binding-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    secrets: inherit
