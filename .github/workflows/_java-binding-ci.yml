name: Java binding tests

on:
  workflow_call:
    inputs:
      java-versions:
        required: true
        type: string
        description: "A JSON-formatted string array of Java versions to test"

  workflow_dispatch:
    inputs:
      java_version:
        description: "Select a Java version to test (or all)"
        type: choice
        required: true
        default: "11"
        options:
          - "11"
          - "17"
          - "21"
          - "All"

jobs:
  java-binding-tests:
    name: Test Java binding (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.java_version == 'All' && '["11", "17", "21"]' || format('["{0}"]', inputs.java_version)) || inputs['java-versions']) }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: extractions/setup-just@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: java-binding-${{ matrix.os }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Run Java checks and tests
        run: just java ci
