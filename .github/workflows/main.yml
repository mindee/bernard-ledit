name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: ./.github/workflows/_workflow_lint.yml

  pre-commit:
    uses: ./.github/workflows/_pre-commit.yml
    needs: workflow-lint

  unit-tests:
    uses: ./.github/workflows/_unit-tests.yml
    needs: pre-commit

  python-binding-tests:
    uses: ./.github/workflows/_python-binding-tests.yml
    needs: pre-commit

  java-binding-tests:
    uses: ./.github/workflows/_java-binding-ci.yml
    needs: pre-commit

  hack-test-release:
    uses: ./.github/workflows/_hack-test-release.yml
    needs: unit-tests
