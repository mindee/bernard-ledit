name: Unit Tests without PDF support

on:
  workflow_call:

env:
  # The bernard-ledit release the tests install with PIE.
  BERNARD_LEDIT_VERSION: "0.1.0-alpha2"

defaults:
  run:
    shell: bash

jobs:
  no-pdf:
    name: Unit Tests on ${{ matrix.os }} without PDF support (PHP ${{ matrix.php-version }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Oldest and newest PHP on each OS: the code without the extension doesn't vary in between.
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        php-version:
          - "8.1"
          - "8.5"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: php vendor/bin/phpunit -c tests/pdffeatures.xml

  with-pdf:
    name: Unit Tests on ${{ matrix.os }} with PDF support (PHP ${{ matrix.php-version }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Every PHP version on Linux; the oldest and newest on macOS and Windows. On Windows, they also
      # cover both compilers the extension is built with (8.1-8.3: VS16, 8.4+: VS17).
      matrix:
        os:
          - ubuntu-latest
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        include:
          - { os: macos-latest, php-version: "8.1" }
          - { os: macos-latest, php-version: "8.5" }
          - { os: windows-latest, php-version: "8.1" }
          - { os: windows-latest, php-version: "8.5" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, fileinfo, json
          tools: pie

      - name: Install bernard-ledit extension
        if: runner.os != 'Windows'
        run: bash tools/install-bernard-ledit.sh "$BERNARD_LEDIT_VERSION"

      # The install script is written for Linux and macOS; on Windows, PIE also enables the
      # extension in php.ini.
      - name: Install bernard-ledit extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pie install "mindee/bernard-ledit:$env:BERNARD_LEDIT_VERSION"
          if (-not (php -m | Select-String -Pattern '^bernard_ledit$' -Quiet)) {
            Write-Error "bernard_ledit did not load"
            exit 1
          }
          php -r 'echo "bernard_ledit ", phpversion("bernard_ledit"), PHP_EOL;'

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit testing with phpunit
        env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
        run: php vendor/bin/phpunit -c tests/phpunit.xml
