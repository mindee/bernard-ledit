name: Unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache PDFium binary
        uses: actions/cache@v6
        with:
          path: core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ hashFiles('core/build.rs') }}
          restore-keys: |
            pdfium-${{ runner.os }}-

      - name: Install PHP dev headers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-dev libphp-embed libclang-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: extractions/setup-just@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Make libphp discoverable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          lib="$(find /usr/lib /usr/local/lib -name 'libphp*.so*' 2>/dev/null | sort | head -n 1)"
          if [ -z "$lib" ]; then
            echo "::error::No libphp*.so found: libphp-embed is not installed"
            exit 1
          fi
          echo "Found: $lib"
          dir="$(dirname "$lib")"
          [ -e "$dir/libphp.so" ] || sudo ln -s "$lib" "$dir/libphp.so"
          echo "LD_LIBRARY_PATH=$dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run core tests
        run: just core test