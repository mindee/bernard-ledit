name: Publish Python wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: linux-x64
          - runner: windows-2022
            label: win-x64
          - runner: macos-15-intel
            label: macos-x64
          - runner: macos-14
            label: macos-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build wheel
        run: maturin build --release --manifest-path bindings/python/Cargo.toml --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheels to PyPI
    runs-on: ubuntu-22.04
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install upload dependencies
        run: python -m pip install --upgrade pip twine

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Test upload
        env:
          TWINE_NON_INTERACTIVE: "1"
          TWINE_USERNAME: ${{ secrets.PYPI_TEST_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_PASSWORD }}
        run: twine upload --disable-progress-bar --repository testpypi --skip-existing dist/*

      - name: Publish wheels
        env:
          TWINE_NON_INTERACTIVE: "1"
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload --disable-progress-bar --skip-existing dist/*
