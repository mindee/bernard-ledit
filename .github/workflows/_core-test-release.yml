name: Rust core release tests

on:
  workflow_call:
permissions:
  contents: read
jobs:
  test-release:
    name: Rust release tests (Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-libheif
      - uses: extractions/setup-just@v4

      - uses: ./.github/actions/setup-pdfium

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-release-${{ runner.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run release tests
        run: just core test-release
