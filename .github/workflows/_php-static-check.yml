name: PHP binding tests (static lib build)

on:
  push:
    branches: [add-php-ext-publish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-binding-tests:
    name: Test static PHP binding (${{ matrix.platform.pdfium_target }}, PHP ${{ matrix.php }} ${{ matrix.thread_safety }})
    runs-on: ${{ matrix.platform.runner }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: "1.99.0"

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,    pdfium_target: linux-x64-glibc }
          - { runner: ubuntu-24.04-arm, pdfium_target: linux-arm64-glibc }
          - { runner: macos-latest,     pdfium_target: mac-arm64 }
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        thread_safety: [ "zts", "nts" ]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download static PDFium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="pdfium-static-$(tr -d '[:space:]' < core/pdfium-release)"; rel="${rel//\//_}"
          # PHP 8.1-8.3 are built with MSVC 14.29 (v142), 8.4+ with 14.44 (v143).
          target=${{ contains(fromJSON('["8.1", "8.2", "8.3"]'), matrix.php) && 'win-x64-v142' || 'win-x64-v143' }}
          mkdir -p "$RUNNER_TEMP/pdfium-static"
          gh release download "$rel" -p "libpdfium-$target.lib" -O "$RUNNER_TEMP/pdfium-static/pdfium.lib"
          echo "PDFIUM_STATIC_LIB_PATH=$RUNNER_TEMP/pdfium-static" >> "$GITHUB_ENV"

      - uses: extractions/setup-just@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: php-static-${{ matrix.platform.pdfium_target }}-php${{ matrix.php }}-${{ matrix.thread_safety }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
        env:
          phpts: ${{ matrix.thread_safety }}

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        working-directory: bindings/php
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ runner.arch }}-php${{ matrix.php }}-${{ matrix.thread_safety }}-${{ hashFiles('bindings/php/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ runner.arch }}-php${{ matrix.php }}-${{ matrix.thread_safety }}-

      - name: Build and test (static PDFium)
        run: just php test-static

      - name: Check the extension is self-contained
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ext=target/release/libbernard_ledit_php.dylib
            otool -L "$ext"
            if otool -L "$ext" | grep -qi pdfium; then echo "::error::$ext links pdfium dynamically"; exit 1; fi
          else
            ext=target/release/libbernard_ledit_php.so
            if ldd "$ext" | grep -qi pdfium; then echo "::error::$ext links pdfium dynamically"; exit 1; fi
            max="$(objdump -T "$ext" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)"
            echo "Highest glibc symbol: $max"
            [ "$(printf '%s\n' "$max" 2.35 | sort -V | tail -n 1)" = 2.35 ] || { echo "::error::needs glibc $max > 2.35"; exit 1; }
          fi

  php-binding-tests-musl:
    name: Test static PHP binding (linux-${{ matrix.arch }}-musl, PHP ${{ matrix.php }} ${{ matrix.thread_safety }})
    # Don't run inside Alpine containers on arm64 runners.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        thread_safety: [ "zts", "nts" ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download static PDFium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="pdfium-static-$(tr -d '[:space:]' < core/pdfium-release)"; rel="${rel//\//_}"
          mkdir -p .pdfium-static
          gh release download "$rel" -p "libpdfium-linux-${{ matrix.arch }}-musl.a" -O .pdfium-static/libpdfium.a

      - name: Build and test in Alpine
        run: |
          image="php:${{ matrix.php }}-${{ matrix.thread_safety == 'zts' && 'zts' || 'cli' }}-alpine"
          docker run --rm -v "$PWD:/w" -w /w -e PDFIUM_STATIC_LIB_PATH=/w/.pdfium-static "$image" sh -euc '
            apk add --no-cache bash git curl unzip build-base cmake nasm clang-dev linux-headers just rustup libstdc++
            rustup-init -y --default-toolchain none --profile minimal
            . "$HOME/.cargo/env"
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            # Rust links the C runtime statically on musl by default; a PHP extension must not.
            export RUSTFLAGS="-C target-feature=-crt-static"
            just php test-static
            ext=target/release/libbernard_ledit_php.so
            deps="$(ldd "$ext" 2>/dev/null || true)"
            echo "$deps"
            if echo "$deps" | grep -qi pdfium; then echo "links pdfium dynamically" >&2; exit 1; fi
          '
  php-binding-tests-windows:
    name: Test static PHP binding (win-x64, PHP ${{ matrix.php }} ${{ matrix.thread_safety }}, MSVC ${{ contains(fromJSON('["8.1", "8.2", "8.3"]'), matrix.php) && 'v142' || 'v143' }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      # ext-php-rs needs nightly on Windows (vectorcall ABI); overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        thread_safety: [ "zts", "nts" ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download static PDFium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="pdfium-static-$(tr -d '[:space:]' < core/pdfium-release)"; rel="${rel//\//_}"
          mkdir -p "$RUNNER_TEMP/pdfium-static"
          gh release download "$rel" -p "libpdfium-win-x64.lib" -O "$RUNNER_TEMP/pdfium-static/pdfium.lib"
          echo "PDFIUM_STATIC_LIB_PATH=$RUNNER_TEMP/pdfium-static" >> "$GITHUB_ENV"

      - uses: extractions/setup-just@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: php-static-win-x64-php${{ matrix.php }}-${{ matrix.thread_safety }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
        env:
          phpts: ${{ matrix.thread_safety }}

      - name: Pin MSVC toolset to match the PHP build
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ contains(fromJSON('["8.1", "8.2", "8.3"]'), matrix.php) && '14.29' || '14.44' }}

      - name: Remove MSYS GNU link.exe
        run: rm -f "/c/Program Files/Git/usr/bin/link.exe"

      - name: Build and test (static PDFium)
        run: just php test-static

      - name: Check the extension is self-contained
        run: |
          ext=target/release/bernard_ledit_php.dll
          deps="$("/c/Program Files/LLVM/bin/llvm-readobj.exe" --coff-imports "$ext" | grep -i '^ *Name:' || true)"
          echo "$deps"
          if echo "$deps" | grep -qi pdfium; then echo "::error::$ext links pdfium dynamically"; exit 1; fi