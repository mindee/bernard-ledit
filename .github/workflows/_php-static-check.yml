name: PHP binding tests (static lib build)

on:
#  workflow_call:
#    inputs:
#      php-versions:
#        required: true
#        type: string
#        description: "A JSON-formatted string array of PHP versions to test"
  push:
    branches: [add-php-ext-publish]

#  workflow_dispatch:
#    inputs:
#      php_version:
#        description: "Select a PHP version to test (or all)"
#        type: choice
#        required: true
#        default: "8.1"
#        options:
#          - "8.1"
#          - "8.2"
#          - "8.3"
#          - "8.4"
#          - "8.5"
#          - "All"


permissions:
  contents: read

jobs:
  php-binding-tests:
    name: Test static PHP binding (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && 'nightly' || '1.99.0' }}

    strategy:
      fail-fast: false
#      matrix:
#        os: [ ubuntu-latest, macos-latest, windows-latest ]
#        os: [ ubuntu-latest ]
#        php: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.php_version == 'All' && '["8.1", "8.2", "8.3", "8.4", "8.5"]' || format('["{0}"]', inputs.php_version)) || inputs['php-versions']) }}
#        thread_safety: [ "zts", "nts" ]
      matrix:
        os: [ ubuntu-latest ]
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        thread_safety: [ "zts", "nts" ]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download static PDFium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="pdfium-static-$(tr -d '[:space:]' < core/pdfium-release)"; rel="${rel//\//_}"
          mkdir -p "$RUNNER_TEMP/pdfium-static"
          gh release download "$rel" -p "libpdfium-linux-x64-glibc.a" -O "$RUNNER_TEMP/pdfium-static/libpdfium.a"
          echo "PDFIUM_STATIC_LIB_PATH=$RUNNER_TEMP/pdfium-static" >> "$GITHUB_ENV"

      - uses: extractions/setup-just@v4

      # Runs only on non-Windows runners (Ubuntu, macOS)
      - name: Set up Rust toolchain
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@1.99.0

      # Runs only on Windows runners
      - name: Setup Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: php-binding-${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.thread_safety }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
        env:
          phpts: ${{ matrix.thread_safety }}

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        working-directory: bindings/php
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.thread_safety }}-${{ hashFiles('bindings/php/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.thread_safety }}-
            composer-${{ runner.os }}-

      - name: Pin MSVC toolset to match PHP build (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ contains(fromJSON('["8.1", "8.2", "8.3"]'), matrix.php) && '14.29' || '14.44' }}

      - name: Remove MSYS GNU link.exe (Windows)
        if: runner.os == 'Windows'
        run: rm "C:\Program Files\Git\usr\bin\link.exe"

      - name: Build and test (static PDFium)
        run: just php test-static

      - name: Check the extension is self-contained
        run: |
          ext=target/release/libbernard_ledit_php.so
          if ldd "$ext" | grep -qi pdfium; then
            echo "::error::$ext dynamically links against pdfium"
            exit 1
          fi
          objdump -T "$ext" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1
