name: Remote pre-commit

on:
  workflow_call:

env:
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: Check formatting
        run: just core format-check

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: extractions/setup-just@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - name: Cache PDFium binary
        uses: actions/cache@v6
        with:
          path: core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ hashFiles('core/build.rs') }}
          restore-keys: |
            pdfium-${{ runner.os }}-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: just core clippy

  hack:
    name: Check feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: extractions/setup-just@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Cache PDFium binary
        uses: actions/cache@v6
        with:
          path: core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ hashFiles('core/build.rs') }}
          restore-keys: |
            pdfium-${{ runner.os }}-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Check feature matrix
        run: just core hack-check

  deps:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: extractions/setup-just@v4
      - name: Set up nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache PDFium binary
        uses: actions/cache@v6
        with:
          path: core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ hashFiles('core/build.rs') }}
          restore-keys: |
            pdfium-${{ runner.os }}-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-udeps
      - name: Check licenses and advisories
        run: just core check-deps

  # `just python build` runs `maturin develop`, which installs the extension with its test and
  # lint extras (ruff, mypy) into the active virtualenv: the one this job puts first on PATH.
  python:
    name: Check the Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: extractions/setup-just@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create a virtualenv with maturin
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install "maturin>=1.0,<2.0"
      - name: Cache PDFium binary
        uses: actions/cache@v6
        with:
          path: core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ hashFiles('core/build.rs') }}
          restore-keys: |
            pdfium-${{ runner.os }}-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build the Python extension
        run: just python build
      - name: Check the Python formatting, lint and types
        run: just python lint-check
      - name: Check the stubs match the extension
        run: just python stubs-check

  # `just php stubs-check` builds the extension, regenerates the stubs from it, and fails if they
  # differ from the committed bernard_ledit.stubs.php.
  php:
    name: Check the PHP binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: extractions/setup-just@v4
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Cache PDFium binary
        uses: actions/cache@v6
        with:
          path: core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ hashFiles('core/build.rs') }}
          restore-keys: |
            pdfium-${{ runner.os }}-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check the stubs match the extension
        run: just php stubs-check
