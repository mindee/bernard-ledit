name: Remote pre-commit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-all:
    name: Run all checks
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-pdfium
      - uses: ./.github/actions/setup-libheif
      # Building the PHP binding runs bindgen, which requires Clang and libclang.
      - uses: ./.github/actions/setup-clang
      - uses: extractions/setup-just@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create a virtualenv with maturin
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install "maturin>=1.0,<2.0"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash

      - name: Add actionlint to PATH
        env:
          ACTIONLINT: ${{ steps.get_actionlint.outputs.executable }}
        run: dirname "$ACTIONLINT" >> "$GITHUB_PATH"

      - name: Run all checks
        run: just check-all
