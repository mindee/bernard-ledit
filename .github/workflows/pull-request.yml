name: Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    uses: ./.github/workflows/_pre-commit.yml

  unit-tests:
    uses: ./.github/workflows/_core-tests.yml
    needs: pre-commit

  python-binding-tests:
    uses: ./.github/workflows/_python-binding-tests.yml
    needs: pre-commit
    with:
      python-versions: '["3.11"]'

  php-binding-tests:
    uses: ./.github/workflows/_php-binding-tests.yml
    needs: pre-commit
    with:
      php-versions: '["8.2"]'

  java-binding-tests:
    uses: ./.github/workflows/_java-binding-ci.yml
    needs: pre-commit
    with:
      java-versions: '["11"]'
