name: PHP binding tests

on:
  workflow_call:
    inputs:
      php-versions:
        required: true
        type: string
        description: "A JSON-formatted string array of PHP versions to test"

  workflow_dispatch:
    inputs:
      php_version:
        description: "Enter a PHP version to test, or All"
        type: string
        required: true
        default: "All"

permissions:
  contents: read

jobs:
  php-binding-tests:
    name: Test PHP binding (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && 'nightly' || '1.99.0' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        php: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.php_version != 'All' && format('[{0}]', toJSON(inputs.php_version)) || vars.PHP_VERSIONS) || inputs['php-versions']) }}
        thread_safety: [ "zts", "nts" ]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # MSVC setup changes VCPKG_ROOT because it brings its own vcpkg tree; 
      # run it first so setup-libheif can select MSVC's installed vcpkg tree.
      - name: Pin MSVC toolset to match PHP build (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ contains(fromJSON('["8.2", "8.3"]'), matrix.php) && '14.29' || '14.44' }}

      - uses: ./.github/actions/setup-libheif

      - uses: ./.github/actions/setup-clang
        if: runner.os == 'Linux'

      - uses: ./.github/actions/setup-pdfium
        with:
          target: ${{ runner.os == 'Windows' && (contains(fromJSON('["8.2", "8.3"]'), matrix.php) && 'win-x64-v142' || 'win-x64-v143') || '' }}

      - uses: extractions/setup-just@v4

      # Runs only on non-Windows runners (Ubuntu, macOS)
      - name: Set up Rust toolchain
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@1.99.0

      # ext-php-rs needs nightly on Windows for the vectorcall ABI.
      - name: Setup Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: php-binding-${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.thread_safety }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
        env:
          phpts: ${{ matrix.thread_safety }}

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        working-directory: bindings/php
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.thread_safety }}-${{ hashFiles('bindings/php/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.thread_safety }}-
            composer-${{ runner.os }}-

      - name: Remove MSYS GNU link.exe (Windows)
        if: runner.os == 'Windows'
        run: rm "C:\Program Files\Git\usr\bin\link.exe"

      - name: Build PHP Extension
        run: just php build

      - name: Unit test
        run: just php test

      - name: Test PHP extension over HTTP
        if: matrix.php == '8.2' && matrix.thread_safety == 'nts'
        shell: bash
        run: bash bindings/php/tools/test-server.sh
