name: 🚀 Feature request
description: Submit a proposal/request for a new feature for Bernard l'Édit
labels: enhancement

body:
  - type: dropdown
    attributes:
      label: Scope
      description: Which part of bernard-ledit would this affect?
      options:
        - Rust core
        - Python binding
        - .NET binding
        - Java binding
        - Node.js binding
        - PHP binding
        - Ruby binding
        - All bindings
        - Build / CI
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🚀 The feature
      description: >
        A clear and concise description of the feature proposal.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Motivation
      description: >
        Why is this needed? Is it related to a specific problem or use case?
        e.g., *"I'm processing multi-page PDFs and need X to avoid Y"*.
        Link any related issues here too.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: >
        Any alternative approaches you've considered, if applicable.

  - type: textarea
    attributes:
      label: Additional context
      description: >
        Any other context, examples, or references (e.g. how another library handles this).

  - type: markdown
    attributes:
      value: >
        Thanks for contributing 🎉
