name: 🐛 Bug report
description: Create a report to help us improve the library
labels: bug

body:
  - type: markdown
    attributes:
      value: >
        #### Before reporting a bug, please check that the issue hasn't already been addressed in the existing and past issues.

  - type: dropdown
    attributes:
      label: Affected binding / component
      description: Which part of bernard-ledit is affected?
      options:
        - Rust core
        - Python binding
        - .NET binding
        - Java binding
        - Node.js binding
        - PHP binding
        - Ruby binding
        - Build / CI
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Bug description
      description: |
        A clear and concise description of what the bug is.

        Please explain the result you observed and the behavior you were expecting.
      placeholder: |
        A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Code snippet to reproduce the bug
      description: |
        Minimal code to reproduce the problem.

        Please wrap your code snippet with ```` ```triple quotes blocks``` ```` for readability.
      placeholder: |
        ```rust
        // or python / js / etc.
        // minimal reproduction
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Error message / traceback
      description: |
        The full error message or traceback you received.

        Please wrap it with ```` ```triple quotes blocks``` ```` for readability.
      placeholder: |
        ```
        error or traceback here
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: |
        Please fill in the following:
        - **bernard-ledit version** (e.g. `0.4.0`):
        - **Language + version** (e.g. Python 3.12, Rust 1.88, Node 20):
        - **OS** (e.g. Ubuntu 24.04, macOS 15, Windows 11):
        - **Install method** (e.g. `pip install bernard-ledit`, built from source):
      placeholder: |
        - bernard-ledit version:
        - Language + version:
        - OS:
        - Install method:
    validations:
      required: true

  - type: markdown
    attributes:
      value: >
        Thanks for helping us improve the library!
