[package]
name = "bernard-ledit-php"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[package.metadata.cargo-udeps.ignore]
normal = ["bernard-ledit"]

[lib]
name = "bernard_ledit_php"
crate-type = ["cdylib"]

[dependencies]
bernard-ledit = { path = "../../core", features = ["full"] }
ext-php-rs = "=0.16.3"

[build-dependencies]
ext-php-rs = { version = "=0.16.3", features = ["closure"] }

[lints]
workspace = true

[features]
static-link = ["bernard-ledit/static-link"]
static-pdfium = ["static-link", "bernard-ledit/static-pdfium"]
static-pdfium-libcxx = ["static-link", "bernard-ledit/static-pdfium-libcxx"]
static-pdfium-msvc = ["static-link", "bernard-ledit/static-pdfium-msvc"]
